
name: Python tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancel outdated runs on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-cloud.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-cloud.txt
          python -m pip install pytest pytest-xdist

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Check notebook dependencies
        run: python -c "import numpy, pandas, plotly.express, IPython, ipykernel, nbformat"

      - name: Run synthetic tests in parallel
        run: python -B -m pytest test/ -n 2 -q
